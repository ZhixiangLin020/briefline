<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="755" viewBox="0 0 1200 755" role="img" aria-labelledby="title desc">
  <title id="title">Briefline Application Workflow with README highlight anchors</title>
  <desc id="desc">A compact vertical workflow showing news ingestion, multi-task inference, agentic verification, related-article retrieval and ranking, and the Briefline application. Numbered anchors map the workflow to project highlights in the README.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="amberArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#A16207"/>
    </marker>
  </defs>

  <rect width="1200" height="755" rx="24" fill="#F8FAFC"/>
  <text x="45" y="48" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Briefline Application Workflow</text>
  <text x="330" y="92" text-anchor="middle" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Function</text>
  <text x="945" y="92" text-anchor="middle" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Key Technology</text>

  <g>
