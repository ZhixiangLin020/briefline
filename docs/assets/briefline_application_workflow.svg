  <g>
    <rect x="900" y="380" width="260" height="90" rx="17" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.7" stroke-dasharray="6 6"/>
    <text x="1030" y="419" text-anchor="middle" fill="#78350F" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Faithfulness Evaluation</text>
    <text x="1030" y="449" text-anchor="middle" fill="#92400E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">RAGAS · Gemini</text>
