  <path d="M 330 627 V 654" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="70" y="662" width="520" height="70" rx="18" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
    <text x="330" y="705" text-anchor="middle" fill="#064E3B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Briefline News Application</text>
    <path d="M 590 697 H 800" stroke="#D6DEE8" stroke-width="1.5"/>
    <rect x="810" y="668" width="270" height="58" rx="16" fill="#E5F9EC" stroke="#34D399" stroke-width="1.7"/>
    <text x="945" y="704" text-anchor="middle" fill="#047857" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">PostgreSQL · Streamlit</text>
  </g>
  <!-- README highlight anchors -->
  <g aria-label="Highlight 4: from benchmarks to current news">
    <rect x="413" y="132" width="42" height="29" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.8"/>
    <text x="434" y="153" text-anchor="middle" fill="#1E293B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">[4]</text>
  </g>

  <g aria-label="Highlight 3: vLLM inference carried forward from the model training workflow">
    <rect x="1017" y="232" width="42" height="29" rx="8" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="1038" y="253" text-anchor="middle" fill="#1E40AF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">[3]</text>
  </g>

  <g aria-label="Highlight 5: agentic verification with LLM-as-a-Judge">
    <rect x="604" y="333" width="42" height="29" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="625" y="354" text-anchor="middle" fill="#5B21B6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">[5]</text>
  </g>

  <g aria-label="Highlight 6: hybrid retrieval and ColBERT reranking">
    <rect x="1010" y="576" width="42" height="29" rx="8" fill="#99F6E4" stroke="#14B8A6" stroke-width="1.8"/>
    <text x="1031" y="597" text-anchor="middle" fill="#115E59" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">[6]</text>
