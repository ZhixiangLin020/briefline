  <g>
    <rect x="70" y="555" width="520" height="72" rx="18" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="2"/>
    <text x="330" y="599" text-anchor="middle" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Related-Article Retrieval &amp; Ranking</text>
    <path d="M 590 591 H 800" stroke="#D6DEE8" stroke-width="1.5"/>
    <rect x="810" y="562" width="270" height="58" rx="16" fill="#E6FAF6" stroke="#2DD4BF" stroke-width="1.7"/>
    <text x="920" y="587" text-anchor="middle" fill="#115E59" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Hybrid Recall</text>
    <text x="920" y="610" text-anchor="middle" fill="#115E59" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ColBERT Reranking</text>
