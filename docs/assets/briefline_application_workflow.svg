    <text x="245" y="413" text-anchor="middle" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Evidence Retrieval</text>
    <text x="245" y="443" text-anchor="middle" fill="#6D28D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">OpenAI Embeddings</text>
    <text x="245" y="466" text-anchor="middle" fill="#6D28D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Weaviate Hybrid Search</text>

