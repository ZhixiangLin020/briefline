    <text x="305" y="153" text-anchor="middle" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">News Ingestion</text>
    <path d="M 590 145 H 800" stroke="#D6DEE8" stroke-width="1.5"/>
    <rect x="810" y="116" width="270" height="58" rx="16" fill="#F1F6FD" stroke="#60A5FA" stroke-width="1.7"/>
    <text x="945" y="152" text-anchor="middle" fill="#1E40AF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Guardian API</text>
  </g>

  <path d="M 330 180 V 202" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

