name: pipeline-ci

on:
  push:
    paths:
      - "data_processing/**"
      - "briefline/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "training/**"
      - "evaluation/**"
      - "rag/**"
      - "frontend/**"
      - "configs/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/data-ci.yml"
  pull_request:
    paths:
      - "data_processing/**"
      - "briefline/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "training/**"
      - "evaluation/**"
      - "rag/**"
      - "frontend/**"
      - "configs/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/data-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reject secrets and hard-coded Colab paths
        run: |
          ! grep -R -n -I -E '(hf_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,})' briefline scripts data_processing training evaluation rag frontend
          ! grep -R -n -I -E '/content/' briefline scripts data_processing training evaluation rag frontend
      - name: Compile
        run: python -m compileall -q briefline scripts data_processing training evaluation rag frontend
      - name: Static checks
        run: ruff check --select E9,F63,F7,F82 briefline scripts data_processing training evaluation rag frontend tests
      - name: Documentation links
        run: python scripts/check_markdown_links.py
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -t .
      - name: CLI smoke check
        run: |
          python -m briefline --help
          python -m briefline data --help
          python -m briefline train --help
          python -m briefline evaluate --help
          python -m briefline all --help
          python -m briefline rag --help
          python -m briefline taxonomy --help
          python -m briefline faithfulness --help
          python -m briefline frontend --help
          python -m briefline check-env --help
          python scripts/install_dependencies.py --help
          python scripts/install_dependencies.py --dry-run
